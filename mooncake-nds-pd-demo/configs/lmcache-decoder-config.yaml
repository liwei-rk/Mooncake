# LMCache config for Decoder (NDS mode, L2-bypassed for pure L3 demo)
#
# Same L2-bypass strategy as prefiller config. See prefiller config for rationale.

chunk_size: 256
local_cpu: False
max_local_cpu_size: 2

remote_url: "mooncakestore://localhost:50051/"
remote_serde: "naive"
save_chunk_meta: false
retrieve_locations: ["RemoteBackend"]

extra_config:
  local_hostname: "decoder-host"
  metadata_server: "http://localhost:8005/metadata"
  protocol: "rdma"
  device_name: ""
  master_server_address: "localhost:50051"
  global_segment_size: 0
  local_buffer_size: 0
  transfer_timeout: 5